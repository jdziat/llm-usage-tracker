name: Desktop CI

# CI for the Wails v2 desktop app (desktop/ — a SEPARATE Go module).
#
# Path-filtered so that CLI-only changes (which never touch the desktop tree
# or the shared core package) don't pay the slow cross-platform desktop cost.
# The root-module CLI is covered by the existing ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pkg/core/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "pkg/core/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Both modules declare the same Go version; the root go.mod is the
          # canonical source of truth.
          go-version-file: go.mod
          # Cache the desktop module's build/download cache keyed on its own
          # go.sum (the root module is stdlib-only and has no go.sum).
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Wails v2 Linux runtime depends on WebKit2GTK 4.1 and GTK3 headers.
      # macOS (WebKit) and Windows (WebView2) need no extra system packages.
      - name: Install Linux WebKit/GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # The frontend must be built first: the Go binary embeds frontend/dist.
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Build, vet, and test desktop module
        working-directory: desktop
        run: |
          go build ./...
          go vet ./...
          go test ./...
