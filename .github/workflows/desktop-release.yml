name: Desktop Release

# Builds the Wails v3 desktop app (desktop/) for each OS on tag pushes and
# attaches the produced binaries to the GitHub release.
#
# NOTE: the macOS and Windows binaries ship UNSIGNED for now.
# Code signing / notarization (Apple) and Authenticode (Windows) is P4 work —
# until then users will see Gatekeeper / SmartScreen warnings on first launch.
#
# The CLI release is handled separately by release.yml / .goreleaser.yaml; this
# workflow only touches the desktop module.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Wails v3 Linux build needs WebKitGTK 6 + GTK4 headers.
      - name: Install Linux WebKit/GTK dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev

      - uses: arduino/setup-task@v2

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98

      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Wails v3 build
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export PKG_CONFIG=/usr/bin/pkg-config
          fi
          wails3 build GOOS=${{ matrix.platform }} GOARCH=${{ matrix.arch }}

      # Package the platform binary under a predictable, OS/arch-tagged name.
      - name: Package bundle
        working-directory: desktop
        run: |
          set -euo pipefail
          asset="llmut-desktop-${{ matrix.platform }}-${{ matrix.arch }}"
          ls -la bin
          case "${{ matrix.platform }}" in
            darwin)
              bin="bin/llmut"
              chmod +x "$bin"
              zip -j "${asset}.zip" "$bin"
              ;;
            windows)
              exe=$(ls bin/*.exe | head -n1)
              # Use 7z (present on GitHub Windows runners) for a portable zip.
              7z a "${asset}.zip" "$exe"
              ;;
            linux)
              bin="bin/llmut"
              chmod +x "$bin"
              tar -czf "${asset}.tar.gz" -C bin llmut
              ;;
          esac

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/llmut-desktop-${{ matrix.platform }}-${{ matrix.arch }}.*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
